name: Deploy Supabase

on:
  push:
    branches:
      - develop
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/supabase-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ahjqjjdaxyibypttwwfj
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push database migrations
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy send-launch-mail --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy unsubscribe --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy list-waitlist --project-ref "$SUPABASE_PROJECT_REF"
